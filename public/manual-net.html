<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Net Anáhuac - Medicina Anáhuac</title>
    <link rel="stylesheet" href="inscripcion-materias.css">
    <style>
        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px 18px;
            background-color: #002d62;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-volver:hover {
            background-color: #001f44;
            transform: translateY(-1px);
        }

        .net-header {
            background-color: #f36c21;
            color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .net-header span {
            font-size: 3rem;
            font-weight: bold;
        }

        .net-header h1 {
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .single-large-img-container {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #f36c21;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .single-large-img-container img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <main class="content-wrapper">
            <!-- Botón para regresar al index.html -->
            <a href="index.html" class="btn-volver">
                ← Volver al inicio
            </a>

            <!-- Cabecera principal estilo Net Anáhuac -->
            <div class="net-header">
                <span>08</span>
                <h1>Net Anáhuac</h1>
            </div>

            <section class="section-block">
                <div class="single-large-img-container">
                    <img src="imagen-net10.jpg" alt="Manual Net Anáhuac Completo">
                </div>
            </section>
        </main>
    </div>

</body>

</html>
